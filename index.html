<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Kontrow Operações</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="img/kontrowFavicon.png"> <!-- logo kontrow na Header do site -->
</head>
<body>

<body>
  <div class="login-page">
    <div class="login-left">
        <div class="logo-com-texto"> 
    <img class="logoLogin" src="img/Logo azul.png" alt="Kontrow Operações"> <!-- logo kontrow no cabeçalho -->
    <div class="logoLogin-texto">OPERAÇÕES</div> <!-- operações abaixo do logo da kontrow-->
  </div> 
      <form id="loginForm">
        <input type="email" id="usuario" placeholder="Digite seu e-mail" required>
        <input type="password" id="senha" placeholder="Digite sua senha" required>

        <a href="" class="link">Esqueci minha senha</a>

        <button type="submit" class="btn-login">Entrar</button>
        <a href="" class="link-secondary">Obtenha uma senha</a>

        <p id="mensagem-erro" style="display: none;"></p>
      </form>

      <div class="footer-links">
        <a href="">Política de Privacidade</a>
        <a href="">Termos de Serviço</a>
        <a href="">Contato</a>
      </div>
    </div>
    <div class="login-right">
      <div><img src="img/ChatGPT Image 2 de jul. de 2025, 14_25_59.png" alt="imagem de login" class="imgLogin"></div>
    </div>
  </div>
  <script src="login.js"></script>
</body>
</html>
