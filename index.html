<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Kontrow Operações</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="img/kontrowFavicon.png">
</head>
<body>
  <div class="login-page">
    <div class="login-left">
      <div class="logo-com-texto"> 
        <img class="logoLogin" src="img/Logo azul.png" alt="Kontrow Operações">
        <div class="logoLogin-texto">OPERAÇÕES</div>
      </div> 

      <form id="loginForm">
        <input type="email" id="usuario" placeholder="Digite seu e-mail" required>
        <input type="password" id="senha" placeholder="Digite sua senha" required>
        <button type="submit" class="btn-login">Entrar</button>
        <label class="manter-login" style="display: flex; align-items: center; gap: 5px; margin-top: 10px;">
          <input type="checkbox" id="manterLogin">
          Manter login
        </label>
        <p id="mensagem-erro" style="display: none; color: red;"></p>
      </form>
      

      <div class="footer-links">
        <a href="#">Política de Privacidade</a>
        <a href="#">Termos de Serviço</a>
        <a href="#">Contato</a>
      </div>
    </div>

    <div class="login-right">
      <div><img src="img/ChatGPT Image 2 de jul. de 2025, 14_25_59.png" alt="imagem de login" class="imgLogin"></div>
    </div>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const usuario = document.getElementById("usuario").value;
      const senha = document.getElementById("senha").value;
      const manterLogin = document.getElementById("manterLogin").checked;

      // Simulação simples de login (substitua por lógica real)
      if (usuario && senha) {
        if (manterLogin) {
          localStorage.setItem("logado", "true");
        } else {
          sessionStorage.setItem("logado", "true");
        }
        window.location.href = "dashboard.html"; // substitua pela página protegida real
      } else {
        const erro = document.getElementById("mensagem-erro");
        erro.textContent = "Usuário ou senha inválidos.";
        erro.style.display = "block";
      }
    });
  </script>
</body>
</html>
